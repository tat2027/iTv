<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IPTV M3U Web Player</title>
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { display: flex; gap: 20px; }
        input { padding: 10px; background: #222; color: #fff; border: 1px solid #444; margin-bottom: 10px; width: 100%; box-sizing: border-box; }
        .sidebar { width: 350px; display: flex; flex-direction: column; }
        .list-box { height: 500px; background: #1e1e1e; border: 1px solid #444; overflow-y: auto; border-radius: 4px; }
        .list-item { padding: 10px; border-bottom: 1px solid #333; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .list-item:hover { background: #333; }
        video { width: 100%; max-height: 550px; background: #000; }
    </style>
</head>
<body>

    <h2>IPTV M3U Player (Geotv.space)</h2>

    <div class="container">
        <div class="sidebar">
            <input type="text" id="searchBox" placeholder="Search channels..." onkeyup="filterItems()">
            <div id="itemList" class="list-box">
                <div class="list-item">Loading M3U playlist...</div>
            </div>
        </div>
        <div style="flex-grow: 1;">
            <video id="videoPlayer" controls autoplay></video>
        </div>
    </div>

    <script>
        const proxyM3uUrl = "https://rapid-heart-9738.onlinework861.workers.dev/?url=" + encodeURIComponent("http://geotv.space:8880/get.php?username=4cf29ac2&password=7ce21cd9&type=m3u_plus&output=ts");
        const proxyBaseUrl = "https://rapid-heart-9738.onlinework861.workers.dev/?url=";

        let allChannels = [];
        let player = null;

        async function loadPlaylist() {
            try {
                const response = await fetch(proxyM3uUrl);
                const text = await response.text();
                parseM3U(text);
            } catch (error) {
                console.error("Error loading playlist:", error);
                document.getElementById('itemList').innerHTML = '<div class="list-item">Error loading playlist.</div>';
            }
        }

        function parseM3U(data) {
            const lines = data.split(/\r?\n/);
            allChannels = [];
            let currentName = "";

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    const commaIndex = line.lastIndexOf(',');
                    if (commaIndex !== -1) {
                        currentName = line.substring(commaIndex + 1).trim();
                    } else {
                        currentName = "Unknown Channel";
                    }
                } else if (line && !line.startsWith('#')) {
                    allChannels.push({
                        name: currentName || "Unknown Channel",
                        url: line
                    });
                    currentName = "";
                }
            }
            displayChannels(allChannels.slice(0, 100));
        }

        function displayChannels(channels) {
            const listContainer = document.getElementById('itemList');
            listContainer.innerHTML = "";
            if (channels.length === 0) {
                listContainer.innerHTML = '<div class="list-item">No results found</div>';
                return;
            }

            channels.forEach(channel => {
                let div = document.createElement('div');
                div.className = 'list-item';
                div.innerText = channel.name;
                
                let finalStreamUrl = proxyBaseUrl + encodeURIComponent(channel.url);
                div.onclick = () => playChannel(finalStreamUrl);
                listContainer.appendChild(div);
            });
        }

        function filterItems() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            if (query.length < 2) {
                displayChannels(allChannels.slice(0, 100));
                return;
            }
            const filtered = allChannels.filter(c => c.name.toLowerCase().includes(query));
            displayChannels(filtered.slice(0, 100));
        }

        function playChannel(url) {
            if (!url) return;
            const videoElement = document.getElementById('videoPlayer');

            if (player) {
                player.destroy();
                player = null;
            }

            if (mpegts.getFeatureList().mseLivePlayback) {
                player = mpegts.createPlayer({
                    type: 'mpegts',
                    isLive: true,
                    url: url
                }, {
                    enableStashBuffer: false,
                    stashInitialSize: 128,
                    liveBufferLatencyChasing: true
                });
                player.attachMediaElement(videoElement);
                player.load();
                player.play().catch(e => console.log("Playback error:", e));
            } else {
                videoElement.src = url;
                videoElement.play();
            }
        }

        loadPlaylist();
    </script>
</body>
</html>
